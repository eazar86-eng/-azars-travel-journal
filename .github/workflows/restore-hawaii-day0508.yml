name: Restore Hawaii Aug 5

on:
  push:
    paths:
      - '.github/workflows/restore-hawaii-day0508.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Aug 5 and wire into Hawaii page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          src = Path('content/summer-2026.md').read_text(encoding='utf-8')
          marker = '**יום רביעי, 5 באוגוסט**'
          start = src.find(marker)
          if start < 0:
              raise RuntimeError('Could not locate Aug 5 section in summer journal')
          # Find the next bold day heading after Aug 5, regardless of weekday/date wording.
          m = re.search(r'\n\*\*יום\s+[^\n]+\*\*', src[start + len(marker):])
          end = start + len(marker) + m.start() if m else len(src)
          day = src[start:end].strip() + '\n'
          Path('content/day-0508.md').write_text(day, encoding='utf-8')
          Path('_includes/day-0508.md').write_text(day, encoding='utf-8')

          p = Path('trips/hawaii-2026/index.html')
          html = p.read_text(encoding='utf-8')
          needle = '<section id="day-0408" class="day">{% capture d4 %}{% include day-0408.md %}{% endcapture %}{{ d4 | markdownify }}</section>'
          insert = needle + '<section id="day-0508" class="day">{% capture d5 %}{% include day-0508.md %}{% endcapture %}{{ d5 | markdownify }}</section>'
          if 'id="day-0508" class="day"' not in html:
              if needle not in html:
                  raise RuntimeError('Could not find Aug 4 section anchor')
              html = html.replace(needle, insert, 1)
          p.write_text(html, encoding='utf-8')

          sm = Path('sitemap.xml')
          s = sm.read_text(encoding='utf-8')
          for url in [
              'https://azarstravel.com/trips/hawaii-2026/',
              'https://azarstravel.com/trips/florida-cruise-2018/',
              'https://azarstravel.com/trips/georgia-2018/',
              'https://azarstravel.com/trips/london-manchester-2019/',
              'https://azarstravel.com/trips/new-york-2022/',
              'https://azarstravel.com/trips/florida-storm-2022/',
              'https://azarstravel.com/trips/coast-to-coast-2024/'
          ]:
              pattern = r'(<url><loc>' + re.escape(url) + r'</loc><lastmod>)[^<]+(</lastmod>)'
              s = re.sub(pattern, r'\g<1>2026-08-13\2', s)
          sm.write_text(s, encoding='utf-8')
          PY
      - name: Commit restored Hawaii day
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/day-0508.md _includes/day-0508.md trips/hawaii-2026/index.html sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Restore Aug 5 Hawaii entry and refresh sitemap'
            git push
          fi
