name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '_diagnostics/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Pages uses GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Finalize Summer 2026 page inside the built site
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          page = Path('_site/trips/summer-2026/index.html')
          css_path = Path('_site/assets/css/summer-2026-polish.css')
          js_path = Path('_site/assets/js/summer-2026-polish.js')

          s = page.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')
          js = js_path.read_text(encoding='utf-8')

          # Do not rely on separately cached presentation assets.
          s = re.sub(r'<link[^>]+summer-2026-polish\.css[^>]*>', '', s)
          s = re.sub(r'<script[^>]+summer-2026-polish\.js[^>]*></script>', '', s)
          s = re.sub(r'<style id="summer-2026-inline-polish">.*?</style>', '', s, flags=re.S)
          s = re.sub(r'<script id="summer-2026-inline-polish-js">.*?</script>', '', s, flags=re.S)

          # The journal must begin at the actual departure day, not the planning intro.
          plain = "render(main,root);render(day17,root);"
          sliced = "const tripStart=main.indexOf('**מוצאי שבת, 18 ביולי**');const journal=tripStart>=0?main.slice(tripStart):main;render(journal,root);render(day17,root);"
          if plain in s:
              s = s.replace(plain, sliced, 1)

          # Bust only the journal source request; styling is now inline.
          s = re.sub(r'/content/summer-2026\.md\?v=[^\'\"]+', '/content/summer-2026.md?v=20260818stable1', s, count=1)

          inline = f'<style id="summer-2026-inline-polish">{css}</style><script id="summer-2026-inline-polish-js">{js}</script>'
          s = s.replace('</head>', inline + '</head>', 1)
          page.write_text(s, encoding='utf-8')
          PY

      - name: Validate built Summer 2026 HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('_site/trips/summer-2026/index.html').read_text(encoding='utf-8')
          checks = {
            'inline CSS': 'summer-2026-inline-polish' in s,
            'inline JS': 'summer-2026-inline-polish-js' in s,
            'journal slicing': "main.slice(tripStart)" in s,
            '4 cars': '4 רכבים' in s,
            'flights section': 'פינת הטיסות שלנו' in s,
            'cars section': 'פינת הרכבים שלנו' in s,
          }
          print(checks)
          if not all(checks.values()):
              raise SystemExit('Built page validation failed')
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-mobile:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Install browser verifier
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Verify live mobile page
        run: |
          cat > /tmp/check.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:390,height:844}, deviceScaleFactor:1});
            const url = 'https://azarstravel.com/trips/summer-2026/?check=' + Date.now();
            await page.goto(url,{waitUntil:'networkidle',timeout:120000});
            await page.waitForTimeout(2500);
            const data = await page.evaluate(() => {
              const q=s=>document.querySelector(s), qa=s=>[...document.querySelectorAll(s)];
              const story=q('#story'), tools=q('.toolsIn');
              const txt=document.body.innerText;
              return {
                inlineCSS: !!q('#summer-2026-inline-polish'),
                inlineJS: !!q('#summer-2026-inline-polish-js'),
                storyStart: story?.innerText.slice(0,320) || '',
                dayCards: qa('#story .trip-day-card').length,
                firstDate: q('#story .dateHead')?.textContent?.trim() || '',
                firstTitle: q('#story .dayTitle')?.textContent?.trim() || '',
                bodyWidth: document.body.scrollWidth,
                viewportWidth: innerWidth,
                toolsScrollable: tools ? tools.scrollWidth > tools.clientWidth : false,
                hasFourCars: txt.includes('4 רכבים') || txt.includes('ארבעה רכבים'),
                hasFlights: txt.includes('פינת הטיסות שלנו'),
                hasCars: txt.includes('פינת הרכבים שלנו')
              };
            });
            console.log(JSON.stringify(data,null,2));
            const ok = data.inlineCSS && data.inlineJS && data.dayCards > 0 && /18 ביולי/.test(data.storyStart) && /יוצאים לדרך/.test(data.storyStart) && data.bodyWidth <= data.viewportWidth + 2 && data.hasFourCars && data.hasFlights && data.hasCars;
            await browser.close();
            if(!ok) process.exit(2);
          })();
          JS
          node /tmp/check.js
