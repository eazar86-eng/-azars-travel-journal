name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '_diagnostics/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Pages uses GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow || true

      - name: Persist Summer 2026 presentation in source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('trips/summer-2026/index.html')
          s = p.read_text(encoding='utf-8')

          css = '<link rel="stylesheet" href="/assets/css/summer-2026-polish.css?v=20260818mag3">'
          js = '<script defer src="/assets/js/summer-2026-polish.js?v=20260818mag3"></script>'

          if 'summer-2026-polish.css' not in s:
              s = s.replace('</head>', css + js + '</head>', 1)

          old = "render(main,root);render(day17,root);"
          new = "const tripStart=main.indexOf('**מוצאי שבת, 18 ביולי**');const journal=tripStart>=0?main.slice(tripStart):main;render(journal,root);render(day17,root);"
          if old in s:
              s = s.replace(old, new, 1)

          for oldver in ['20260817full6','20260818full7','20260818full8','20260818full9']:
              s = s.replace(oldver, '20260818full10')

          p.write_text(s, encoding='utf-8')
          PY

          if ! git diff --quiet -- trips/summer-2026/index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add trips/summer-2026/index.html
            git commit -m "Persist Summer 2026 mobile presentation"
            git push
            echo "Source persisted; the follow-up run will publish the committed version."
            exit 0
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-mobile:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install browser verifier
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Verify live mobile page
        run: |
          mkdir -p _diagnostics
          cat > /tmp/check.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:390,height:844}, deviceScaleFactor:1});
            const url = 'https://azarstravel.com/trips/summer-2026/?check=' + Date.now();
            let navigationError = null;
            try {
              await page.goto(url,{waitUntil:'networkidle',timeout:120000});
              await page.waitForTimeout(2500);
            } catch(e) { navigationError = String(e); }

            const data = await page.evaluate(() => {
              const q=s=>document.querySelector(s);
              const qa=s=>[...document.querySelectorAll(s)];
              const story=q('#story');
              const tools=q('.toolsIn');
              const snap=q('.snapshot');
              const bodyText=document.body.innerText;
              const firstP=q('#story p');
              return {
                title: document.title,
                bodyWidth: document.body.scrollWidth,
                viewportWidth: innerWidth,
                horizontalOverflow: document.body.scrollWidth > innerWidth + 2,
                cssLoaded: !!q('link[href*="summer-2026-polish.css"]'),
                jsLoaded: !!q('script[src*="summer-2026-polish.js"]'),
                storyStart: story ? story.innerText.slice(0,260) : null,
                dayCards: qa('#story .trip-day-card').length,
                firstDate: q('#story .dateHead')?.textContent?.trim() || null,
                firstTitle: q('#story .dayTitle')?.textContent?.trim() || null,
                firstParagraphFont: firstP ? getComputedStyle(firstP).fontSize : null,
                firstParagraphLineHeight: firstP ? getComputedStyle(firstP).lineHeight : null,
                toolsScrollable: tools ? tools.scrollWidth > tools.clientWidth : false,
                toolsOverflowX: tools ? getComputedStyle(tools).overflowX : null,
                snapshotDisplay: snap ? getComputedStyle(snap).display : null,
                snapshotHeight: snap?.getBoundingClientRect().height || null,
                hasFourCarsText: bodyText.includes('4 רכבים') || bodyText.includes('ארבעה רכבים'),
                hasFlightsSection: bodyText.includes('פינת הטיסות שלנו'),
                hasCarsSection: bodyText.includes('פינת הרכבים שלנו'),
                firstCardRadius: q('.trip-day-card') ? getComputedStyle(q('.trip-day-card')).borderRadius : null
              };
            });

            data.navigationError = navigationError;
            data.ok = !data.horizontalOverflow && data.cssLoaded && data.jsLoaded && data.dayCards > 0 && /18 ביולי/.test(data.storyStart||'') && /יוצאים לדרך/.test(data.storyStart||'') && data.hasFourCarsText && data.hasFlightsSection && data.hasCarsSection;
            require('fs').writeFileSync('_diagnostics/summer-2026-mobile.json', JSON.stringify(data,null,2));
            await page.screenshot({path:'_diagnostics/summer-2026-mobile.png',fullPage:true});
            await browser.close();
            if(!data.ok){ console.error(data); process.exit(2); }
          })();
          JS
          node /tmp/check.js

      - name: Save mobile verification report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _diagnostics/summer-2026-mobile.json _diagnostics/summer-2026-mobile.png || true
          if ! git diff --cached --quiet; then
            git commit -m "Save Summer 2026 mobile verification"
            git push
          fi
