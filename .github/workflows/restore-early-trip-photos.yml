name: Restore early Summer 2026 photos

on:
  push:
    paths:
      - '.github/workflows/restore-early-trip-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link New York Rockies and Glacier photos into main journal
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('content/summer-2026.md')
          s=p.read_text(encoding='utf-8')

          def block(label, folder, count, caption):
              imgs='\n\n'.join(f'![{caption} {i}](/assets/summer-2026/{folder}/{i:02d}.jpg)' for i in range(1,count+1))
              return f'\n\n<!-- {label}_PHOTOS_START -->\n{imgs}\n<!-- {label}_PHOTOS_END -->\n'

          for label in ('NYC','ROCKIES','GLACIER'):
              s=re.sub(rf'\n?<!-- {label}_PHOTOS_START -->.*?<!-- {label}_PHOTOS_END -->\n?', '\n', s, flags=re.S)

          inserts=[
              ('**נחיתה בניו יורק וגמר גביע העולם**','NYC','nyc-road',5,'ניו יורק'),
              ('**יום חמישי, 23 ביולי**','ROCKIES','rockies',17,'הרוקייז הקנדיים'),
              ('**יום חמישי, 30 ביולי**','GLACIER','glacier',13,'גליישר')
          ]

          for marker,label,folder,count,caption in inserts:
              pos=s.find(marker)
              if pos < 0:
                  if label=='ROCKIES':
                      m=re.search(r'\*\*[^\n]*23 ביולי[^\n]*\*\*',s)
                      if m: pos=m.start(); marker=m.group(0)
                  elif label=='GLACIER':
                      m=re.search(r'\*\*[^\n]*30 ביולי[^\n]*\*\*',s)
                      if m: pos=m.start(); marker=m.group(0)
              if pos < 0:
                  raise RuntimeError(f'Missing marker for {label}')
              end=pos+len(marker)
              s=s[:end]+block(label,folder,count,caption)+s[end:]

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit restored galleries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/summer-2026.md
          git diff --cached --quiet && exit 0
          git commit -m 'Restore New York Rockies and Glacier galleries in main journal'
          git push
