name: Close Summer 2026 journal
on:
  push:
    paths:
      - '.github/workflows/close-summer-2026-journal.yml'
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append final journal chapter
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('content/summer-2026.md')
          s = p.read_text(encoding='utf-8')
          marker = '**סוף המסע, חוזרים הביתה**'
          if marker not in s:
              closing = r'''

**יום רביעי, 19 באוגוסט**

**סוף המסע, חוזרים הביתה**

אחרי לילה אחרון בלוס אנג'לס, אריזות אחרונות, בדיקות חוזרות של הדרכונים והמזוודות ותחושה שקשה להסביר, הגיע הרגע שבמשך חודש שלם כמעט לא חשבנו עליו: הדרך הביתה.

עלינו על טיסת אל על מלוס אנג'לס לישראל, טיסה ארוכה של כ־13 וחצי שעות. אחרי כל הטיסות, הכבישים, המעברים והימים העמוסים של המסע, דווקא הטיסה האחרונה עברה בנעימים. ישנו, צפינו בסרטים, אכלנו, דיברנו ובעיקר התחלנו לעכל שהמסע הגדול שלנו באמת מגיע לסיומו.

באיזשהו שלב, מעל האוקיינוס ובדרך חזרה הביתה, שאלנו את הילדים מה הם לוקחים איתם מהחודש הזה.

אריאל סיכם את זה בפשטות: "היו בטיול הזה דברים שחלמתי עליהם הרבה זמן, אבל הכי חזק היה לעשות אותם ביחד עם המשפחה."

נויה אמרה: "אני לא חושבת שיש מקום אחד שהוא הכי יפה. בכל פעם שהגענו למקום חדש חשבתי שזה השיא, ואז הגיע המקום הבא."

ועומרי, במשפט שאולי סיכם את כולנו הכי טוב, אמר: "אז מתי מתחילים לתכנן את הטיול הבא?"

**חודש אחד, חיים שלמים של זיכרונות**

כשיצאנו לדרך ידענו שאנחנו יוצאים לטיול גדול. תכננו מסלול, הזמנו מלונות, סימנו אטרקציות, בנינו לוחות זמנים וניסינו לחשוב כמעט על כל פרט. אבל בדיעבד, הדברים שנשארו איתנו הם לא רק המקומות שסימנו מראש.

נשארו איתנו השעות הארוכות יחד ברכב. הצחוקים במלונות. העייפות בשדות התעופה. הפעמים שבהן התוכנית השתנתה. הנופים שגרמו לכולנו לשתוק לרגע. הארוחות המשפחתיות. הרגעים שבהם הילדים התלהבו ממשהו שלא חשבנו בכלל שיהיה משמעותי. וגם הרגעים הפחות מושלמים, שבסוף הפכו לחלק מהסיפור.

עברנו מניו יורק לסיאטל, מסיאטל אל קנדה והרוקייז, דרך אגמים, הרים וכבישים שנראו כאילו נלקחו מסרט, המשכנו לגליישר, חזרנו לסיאטל, טסנו להוואי, עברנו בין ביג איילנד למאווי וסיימנו את המסע בלוס אנג'לס.

חגגנו בר מצווה, בת מצווה, ארבעים, חמש עשרה שנות נישואים ובעיקר את הדבר שהפך את המסע הזה למה שהוא באמת היה: המשפחה שלנו.

בסופו של דבר, לא חזרנו עם רשימה של מקומות שביקרנו בהם. חזרנו עם סיפור משפחתי שלם.

וזה בדיוק מה שרצינו ליצור כשפתחנו, כמעט שנה קודם, את המחשב והתחלנו לתכנן.

**מסע קיץ 2026, הסתיים. היומן נסגר. הזיכרונות רק מתחילים.**
'''
              p.write_text(s.rstrip() + closing + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/summer-2026.md
          git commit -m 'Close Summer 2026 travel journal' || exit 0
          git push
