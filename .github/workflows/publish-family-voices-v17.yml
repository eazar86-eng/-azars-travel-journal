name: Publish family voices v17
on:
  push:
    paths:
      - '.github/workflows/publish-family-voices-v17.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach family voices script
        shell: python
        run: |
          from pathlib import Path
          p=Path('trips/summer-2026/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/assets/js/summer-2026-family-voices-v17.js?v=20260820"></script>'
          if 'summer-2026-family-voices-v17.js' not in s:
              s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
      - name: QA
        run: |
          node --check assets/js/summer-2026-family-voices-v17.js
          grep -q 'summer-2026-family-voices-v17.js' trips/summer-2026/index.html
          grep -q 'המסע דרך העיניים שלהם' assets/js/summer-2026-family-voices-v17.js
          grep -q 'הטיול הכי טוב שהיה לי בחיים' assets/js/summer-2026-family-voices-v17.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trips/summer-2026/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Show family voices at the end of Summer 2026'
          git push