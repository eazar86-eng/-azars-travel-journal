name: Fix final journal display
on:
  push:
    paths:
      - '.github/workflows/fix-final-journal-display.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure final chapter and bust journal cache
        run: |
          python - <<'PY'
          from pathlib import Path

          journal = Path('content/summer-2026.md')
          index = Path('trips/summer-2026/index.html')

          s = journal.read_text(encoding='utf-8')
          marker = '**סוף המסע, חוזרים הביתה**'
          if marker not in s:
              closing = '''

**יום רביעי, 19 באוגוסט**

**סוף המסע, חוזרים הביתה**

אחרי לילה אחרון בלוס אנג'לס, אריזות אחרונות, בדיקות חוזרות של הדרכונים והמזוודות ותחושה שקשה להסביר, הגיע הרגע שבמשך חודש שלם כמעט לא חשבנו עליו: הדרך הביתה.

עלינו על טיסת אל על מלוס אנג'לס לישראל, טיסה ארוכה של 13 וחצי שעות. אחרי כל הטיסות, הכבישים, המעברים והימים העמוסים של המסע, דווקא הטיסה האחרונה עברה בנעימים. ישנו, צפינו בסרטים, אכלנו, דיברנו ובעיקר התחלנו לעכל שהמסע הגדול שלנו באמת מגיע לסיומו.

באחד הרגעים השקטים של הטיסה, כשכבר היה ברור שהמסע מאחורינו, אריאל סיכם את התחושה שלו במשפט פשוט: "היו בטיול הזה דברים שחלמתי עליהם הרבה זמן, אבל הכי חזק היה לעשות אותם ביחד עם המשפחה."

**חודש אחד, חיים שלמים של זיכרונות**

כשיצאנו לדרך ידענו שאנחנו יוצאים לטיול גדול. תכננו מסלול, הזמנו מלונות, סימנו אטרקציות, בנינו לוחות זמנים וניסינו לחשוב כמעט על כל פרט. אבל בדיעבד, הדברים שנשארו איתנו הם לא רק המקומות שסימנו מראש.

נשארו איתנו השעות הארוכות יחד ברכב. הצחוקים במלונות. העייפות בשדות התעופה. הפעמים שבהן התוכנית השתנתה. הנופים שגרמו לכולנו לשתוק לרגע. הארוחות המשפחתיות. הרגעים שבהם הילדים התלהבו ממשהו שלא חשבנו בכלל שיהיה משמעותי.

אולי בגלל זה נויה אמרה משהו שתפס בדיוק את התחושה של המסע כולו: "אני לא חושבת שיש מקום אחד שהוא הכי יפה. בכל פעם שהגענו למקום חדש חשבתי שזה השיא, ואז הגיע המקום הבא."

עברנו מניו יורק לסיאטל, מסיאטל אל קנדה והרוקייז, דרך אגמים, הרים וכבישים שנראו כאילו נלקחו מסרט, המשכנו לגליישר, חזרנו לסיאטל, טסנו להוואי, עברנו בין ביג איילנד למאווי וסיימנו את המסע בלוס אנג'לס.

חגגנו בר מצווה, בת מצווה, ארבעים, חמש עשרה שנות נישואים ובעיקר את הדבר שהפך את המסע הזה למה שהוא באמת היה: המשפחה שלנו.

ובתוך כל הסיכומים, הזיכרונות והגעגוע שכבר התחיל להיכנס, עומרי דאג להחזיר אותנו מהר מאוד למציאות עם השאלה הכי מתבקשת מבחינתו: "אז מתי מתחילים לתכנן את הטיול הבא?"

בסופו של דבר, לא חזרנו עם רשימה של מקומות שביקרנו בהם. חזרנו עם סיפור משפחתי שלם.

וזה בדיוק מה שרצינו ליצור כשפתחנו, כמעט שנה קודם, את המחשב והתחלנו לתכנן.

**מסע קיץ 2026, הסתיים. היומן נסגר. הזיכרונות רק מתחילים.**
'''
              journal.write_text(s.rstrip() + closing + '\n', encoding='utf-8')

          x = index.read_text(encoding='utf-8')
          for old in ['20260818magazine3','20260819dates15','20260819b']:
              x = x.replace(old, '20260820final1630')
          index.write_text(x, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/summer-2026.md trips/summer-2026/index.html
          git diff --cached --quiet || git commit -m 'Publish final Summer 2026 closing'
          git push
