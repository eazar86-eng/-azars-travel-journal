name: Embed car visuals

on:
  push:
    paths:
      - '.github/workflows/embed-car-visuals.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Embed vehicle visuals in JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,re

          js=Path('assets/js/summer-2026-master.js')
          s=js.read_text(encoding='utf-8')
          s=re.sub(r"const VERSION = '[^']+';", "const VERSION = '20260818cars11';", s, count=1)

          for name in ['suburban','pathfinder','tahoe','traverse']:
              raw=Path(f'assets/transport/cars/{name}.svg').read_bytes()
              data='data:image/svg+xml;base64,'+base64.b64encode(raw).decode('ascii')
              s=re.sub(
                  rf"photo:'[^']*{name}[^']*',fallback:'[^']*{name}[^']*'",
                  f"photo:'{data}',fallback:'{data}'",
                  s
              )
          js.write_text(s,encoding='utf-8')

          page=Path('trips/summer-2026/index.html')
          h=page.read_text(encoding='utf-8')
          h=re.sub(r'/assets/js/summer-2026-master\.js\?v=[^"\']+', '/assets/js/summer-2026-master.js?v=20260818cars11', h)
          page.write_text(h,encoding='utf-8')
          PY
      - name: QA
        run: |
          set -e
          node --check assets/js/summer-2026-master.js
          grep -q "20260818cars11" assets/js/summer-2026-master.js
          test "$(grep -o 'data:image/svg+xml;base64' assets/js/summer-2026-master.js | wc -l)" -ge 4
          grep -q '20260818cars11' trips/summer-2026/index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/summer-2026-master.js trips/summer-2026/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Embed vehicle visuals directly in Summer 2026 page'
          git push
