name: Normalize photo orientation
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-photo-orientation.yml'
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Normalize EXIF orientation
        run: |
          find assets/summer-2026 assets/hawaii assets/home -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.JPG' -o -iname '*.JPEG' \) -print0 | while IFS= read -r -d '' f; do
            orient=$(identify -format '%[orientation]' "$f" 2>/dev/null || true)
            if [ -n "$orient" ] && [ "$orient" != "Undefined" ] && [ "$orient" != "TopLeft" ]; then
              echo "Normalizing $f ($orient)"
              mogrify -auto-orient -quality 95 "$f"
            fi
          done
      - name: Commit normalized photos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/summer-2026 assets/hawaii assets/home
          if git diff --cached --quiet; then
            echo 'No orientation changes needed'
          else
            git commit -m 'Normalize photo orientation from EXIF'
            git push
          fi
