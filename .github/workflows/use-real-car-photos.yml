name: Use real car photos

on:
  push:
    paths:
      - '.github/workflows/use-real-car-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace illustrated cars with real photographs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js = Path('assets/js/summer-2026-master.js')
          s = js.read_text(encoding='utf-8')
          s = re.sub(r"const VERSION = '[^']+';", "const VERSION = '20260818realcars12';", s, count=1)

          photos = {
            'suburban': "https://upload.wikimedia.org/wikipedia/commons/thumb/0/07/Chevrolet_Suburban_LT_%282021%29_%2851299181015%29.jpg/960px-Chevrolet_Suburban_LT_%282021%29_%2851299181015%29.jpg",
            'pathfinder': "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9c/2022_Nissan_Pathfinder_SV_in_Super_Black%2C_Front_Left%2C_03-22-2022.jpg/960px-2022_Nissan_Pathfinder_SV_in_Super_Black%2C_Front_Left%2C_03-22-2022.jpg",
            'tahoe': "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7d/%2721_Chevrolet_Tahoe.jpg/960px-%2721_Chevrolet_Tahoe.jpg",
            'traverse': "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7b/2024_Chevrolet_Traverse_front_view.jpg/960px-2024_Chevrolet_Traverse_front_view.jpg",
          }
          credits = {
            'Chevrolet Suburban': 'Photo: Charles · CC BY 2.0',
            'Nissan Pathfinder': 'Photo: Elise240SX · CC BY-SA 4.0',
            'Chevrolet Tahoe': 'Photo: Bull-Doser · Public domain',
            'Chevrolet Traverse': 'Photo: Deathpallie325 · CC BY-SA 4.0',
          }

          for key,url in photos.items():
              pattern = rf"photo:'data:image/svg\+xml;base64,[^']+',fallback:'data:image/svg\+xml;base64,[^']+'(?=,name:'[^']+')"
              m = re.search(pattern, s)
              if m:
                  s = s[:m.start()] + f"photo:'{url}',fallback:''" + s[m.end():]

          # If data URLs have already been removed, replace any local illustrated sources directly by model order.
          replacements = [
            ('suburban', photos['suburban']),
            ('pathfinder', photos['pathfinder']),
            ('tahoe', photos['tahoe']),
            ('traverse', photos['traverse']),
          ]
          for key,url in replacements:
              s = re.sub(rf"photo:'[^']*{key}[^']*',fallback:'[^']*'", f"photo:'{url}',fallback:''", s, count=1)

          for model, credit in credits.items():
              s = s.replace(f"<h4>${{c.name}}</h4><p><strong>${{c.place}}</strong><br>${{c.note}}</p><p class=\"carMasterCredit\">Representative model visual</p>", "<h4>${c.name}</h4><p><strong>${c.place}</strong><br>${c.note}</p><p class=\"carMasterCredit\">${c.credit}</p>")

          # Add per-card credit field if missing.
          s = s.replace("name:'Chevrolet Suburban',place:", "name:'Chevrolet Suburban',credit:'Photo: Charles · CC BY 2.0',place:")
          s = s.replace("name:'Nissan Pathfinder',place:", "name:'Nissan Pathfinder',credit:'Photo: Elise240SX · CC BY-SA 4.0',place:")
          s = s.replace("name:'Chevrolet Tahoe',place:", "name:'Chevrolet Tahoe',credit:'Photo: Bull-Doser · Public domain',place:")
          s = s.replace("name:'Chevrolet Traverse',place:", "name:'Chevrolet Traverse',credit:'Photo: Deathpallie325 · CC BY-SA 4.0',place:")
          s = s.replace('Representative model visual', '${c.credit || ""}')
          s = s.replace("if(fallback && img.src.indexOf(fallback)===-1){img.src=fallback;return}\n      img.closest('.carMasterMedia')?.classList.add('imageError');", "img.closest('.carMasterMedia')?.classList.add('imageError');")
          js.write_text(s, encoding='utf-8')

          page = Path('trips/summer-2026/index.html')
          h = page.read_text(encoding='utf-8')
          h = re.sub(r'/assets/js/summer-2026-master\.js\?v=[^"\']+', '/assets/js/summer-2026-master.js?v=20260818realcars12', h)
          page.write_text(h, encoding='utf-8')
          PY
      - name: QA
        run: |
          set -e
          node --check assets/js/summer-2026-master.js
          grep -q '20260818realcars12' assets/js/summer-2026-master.js
          grep -q '960px-Chevrolet_Suburban' assets/js/summer-2026-master.js
          grep -q '960px-2022_Nissan_Pathfinder' assets/js/summer-2026-master.js
          grep -q "960px-%2721_Chevrolet_Tahoe" assets/js/summer-2026-master.js
          grep -q '960px-2024_Chevrolet_Traverse' assets/js/summer-2026-master.js
          ! grep -q 'Representative model visual' assets/js/summer-2026-master.js
          grep -q '20260818realcars12' trips/summer-2026/index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/summer-2026-master.js trips/summer-2026/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Replace illustrated vehicle cards with real photos'
          git push
