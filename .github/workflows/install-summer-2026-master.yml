name: Install Summer 2026 master layer

on:
  push:
    paths:
      - '.github/workflows/install-summer-2026-master.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install master script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('trips/summer-2026/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/assets/js/summer-2026-master.js?v=20260818qa1"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit installation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trips/summer-2026/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Install Summer 2026 magazine and QA layer'
          git push
      - name: QA marker
        run: echo 'summer-2026-master-qa1'
