name: Publish real car photos v13

# trigger 2026-08-18 14:36 PT
on:
  push:
    paths:
      - '.github/workflows/publish-realcars-v13.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish unique uncached script
        shell: bash
        run: |
          set -euo pipefail
          cp assets/js/summer-2026-master.js assets/js/summer-2026-realcars-v13.js
          python - <<'PY'
          from pathlib import Path
          import re

          js=Path('assets/js/summer-2026-realcars-v13.js')
          s=js.read_text(encoding='utf-8')
          s=re.sub(r"const VERSION = '[^']+';", "const VERSION = '20260818realcars13';", s, count=1)
          js.write_text(s,encoding='utf-8')

          page=Path('trips/summer-2026/index.html')
          h=page.read_text(encoding='utf-8')
          h=re.sub(r'<script src="/assets/js/summer-2026-master\.js\?v=[^"]+"></script>', '<script src="/assets/js/summer-2026-realcars-v13.js"></script>', h)
          page.write_text(h,encoding='utf-8')
          PY
      - name: QA
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/summer-2026-realcars-v13.js
          grep -q "20260818realcars13" assets/js/summer-2026-realcars-v13.js
          grep -q 'upload.wikimedia.org' assets/js/summer-2026-realcars-v13.js
          grep -q 'Chevrolet Suburban' assets/js/summer-2026-realcars-v13.js
          grep -q 'Nissan Pathfinder' assets/js/summer-2026-realcars-v13.js
          grep -q 'Chevrolet Tahoe' assets/js/summer-2026-realcars-v13.js
          grep -q 'Chevrolet Traverse' assets/js/summer-2026-realcars-v13.js
          grep -q 'summer-2026-realcars-v13.js' trips/summer-2026/index.html
          ! grep -q 'summer-2026-master.js?v=' trips/summer-2026/index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/summer-2026-realcars-v13.js trips/summer-2026/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Publish uncached Summer 2026 script with real car photos'
          git push
