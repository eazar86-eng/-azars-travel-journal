name: Update August 15 CityWalk ending
on:
  push:
    paths:
      - '.github/workflows/update-day1508-citywalk.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update story and version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('content/day-1508.md')
          s = p.read_text(encoding='utf-8')
          old = '''מכאן החלטנו לא לרדוף אחרי עוד דברים. חזרנו שוב לאזור המיניונים, עשינו עוד סבב במתקנים שהילדים רצו, הסתובבנו קצת ונתנו ליום להסתיים בקצב רגוע.

בשעה 20:00, שעה לפני סגירת הפארק, החלטנו שזה מספיק. יצאנו דרך שערי יוניברסל והתחלנו ללכת לכיוון החניה.'''
          new = '''מכאן החלטנו לא לרדוף אחרי עוד דברים. חזרנו שוב לאזור המיניונים, עשינו עוד סבב במתקנים שהילדים רצו, הסתובבנו קצת ונתנו ליום להסתיים בקצב רגוע.

![רגעים אחרונים בתוך יוניברסל](/assets/summer-2026/day-1508/IMG_0361.jpeg)

בשעה 20:00, שעה לפני סגירת הפארק, החלטנו שזה מספיק ויצאנו מהפארק. אבל היום עדיין לא הסתיים לגמרי.

## עוד סיבוב ב־Universal CityWalk

בדרך לחניה עברנו דרך Universal CityWalk, הטיילת הצבעונית שמחברת בין הפארק, המסעדות, החנויות ומתחם הבילוי. אחרי יום של מתקנים ואדרנלין הורדנו קצת קצב, הסתובבנו בין החנויות ונכנסנו לכמה מהן כדי לספוג עוד קצת מהאווירה של יוניברסל לפני שנפרדים.

![Universal CityWalk בסוף היום](/assets/summer-2026/day-1508/IMG_0362.jpeg)

זו הייתה סגירה נעימה ליום שהתחיל בכלל כתוכנית אחרת לגמרי. אחרי הסיבוב בחנויות המשכנו לכיוון החניה, הגענו לרכב ויצאנו חזרה למלון.

![הדרך לסיום היום ביוניברסל](/assets/summer-2026/day-1508/IMG_0363.jpeg)

משם נסענו למלון, עייפים אבל מרוצים מאוד מההחלטה הספונטנית ששינתה לנו את כל היום.'''
          if old not in s:
              raise SystemExit('target ending not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          y = Path('_data/current_trip.yml')
          ys = y.read_text(encoding='utf-8')
          ys = ys.replace('version: "20260815universal3"','version: "20260815universal4"')
          y.write_text(ys, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/day-1508.md _data/current_trip.yml
          git commit -m 'Add CityWalk ending and new August 15 photos'
          git push
