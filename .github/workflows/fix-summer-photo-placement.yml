name: Fix Summer 2026 photo placement
on:
  push:
    paths:
      - '.github/workflows/fix-summer-photo-placement.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair photo placement
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('content/summer-2026.md')
          s = p.read_text(encoding='utf-8')

          # New York: keep only the image that is confirmed to be NYC.
          for i in range(2, 6):
              s = re.sub(rf'\n?!\[\]\(/assets/summer-2026/nyc-road/{i:02d}\.jpg\)\n?', '\n', s)

          # The Rockies set was previously dumped into the beginning of 23 July,
          # which visually attached Highway 93 and later-route photos to Kamloops/Banff.
          # Remove the whole generic set from day-level placement first.
          rockies = [f'![](/assets/summer-2026/rockies/{i:02d}.jpg)' for i in range(1, 18)]
          for ref in rockies:
              s = s.replace('\n' + ref + '\n', '\n')
              s = s.replace(ref + '\n', '')

          # Reinsert the generic Rockies set only as a clearly labeled chapter gallery,
          # after the Rockies narrative and before Glacier, so no image is falsely tied
          # to Kamloops, Revelstoke, Banff or Highway 93 until it is positively classified.
          marker = '**יום חמישי, 30 ביולי**'
          gallery = '\n**גלריית הרוקייז הקנדיים**\n\n' + '\n\n'.join(rockies) + '\n\n'
          if marker in s and '**גלריית הרוקייז הקנדיים**' not in s:
              s = s.replace(marker, gallery + marker, 1)

          # Normalize excessive blank lines introduced by removals.
          s = re.sub(r'\n{4,}', '\n\n\n', s)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/summer-2026.md
          git commit -m 'Repair Summer 2026 photo placement by chapter' || exit 0
          git push
