name: Import Hawaii volcano photos
on:
  push:
    paths:
      - '.github/workflows/import-hawaii-volcano.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Download
        run: |
          mkdir -p assets/summer-2026/hawaii-volcano
