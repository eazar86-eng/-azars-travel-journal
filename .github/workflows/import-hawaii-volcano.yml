          curl -fL 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-50b4-81fd-8400-6d93e5f15eb9/raw?se=2026-08-09T03%3A23%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=e43ce65c-dd82-598c-ad19-368fb26acf2b&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-09T02%3A47%3A07Z&ske=2026-08-10T02%3A47%3A07Z&sks=b&skv=2026-02-06&sig=y6gCSvmz24O63hl2OiXOfEgsb9ZCK82IaM6LxHjIse0%3D' -o assets/summer-2026/hawaii-volcano/06.jpg
          curl -fL 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-3970-81fd-b3a9-1bc11e23b156/raw?se=2026-08-09T03%3A23%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=e90e0e94-acae-59e5-8c17-4faa67273e63&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-09T02%3A48%3A53Z&ske=2026-08-10T02%3A48%3A53Z&sks=b&skv=2026-02-06&sig=tPhoyL0UNUnPwwqT3NfbYdWxEfzQw%2BlTKSHLhiR0j2g%3D' -o assets/summer-2026/hawaii-volcano/07.jpg
          curl -fL 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-48a4-81fd-87cc-69744bed1327/raw?se=2026-08-09T03%3A23%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=14b4f583-fe56-5b98-8e22-25c403a886d1&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-09T02%3A47%3A00Z&ske=2026-08-10T02%3A47%3A00Z&sks=b&skv=2026-02-06&sig=q9IdcoFpxDXpJVlJQtgcb1rRab64uagbQETUyzrWYoY%3D' -o assets/summer-2026/hawaii-volcano/08.jpg
          curl -fL 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-89b4-81fd-abbd-62857295e3b9/raw?se=2026-08-09T03%3A24%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=9d0bd5b1-9982-5f26-82b1-230115197f76&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-08T13%3A36%3A30Z&ske=2026-08-09T13%3A36%3A30Z&sks=b&skv=2026-02-06&sig=sbKh8KoRhaTKrRduSFFaoykIXaxNa3JIDRHWcwVXJ5E%3D' -o assets/summer-2026/hawaii-volcano/09.jpg
      - name: Optimize and commit
        run: |
          python -m pip -q install Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for p in Path('assets/summer-2026/hawaii-volcano').glob('*.jpg'):
              im=Image.open(p).convert('RGB'); im.thumbnail((1800,1800),Image.Resampling.LANCZOS); im.save(p,'JPEG',quality=82,optimize=True,progressive=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/summer-2026/hawaii-volcano
          git commit -m 'Add Hawaii volcano photos' || exit 0
          git push