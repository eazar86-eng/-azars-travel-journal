          curl -fL 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-9250-81fd-956b-fddf6a518259/raw?se=2026-08-09T03%3A23%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=cff9a03b-1e13-5889-8e91-5043afb8a414&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-08T14%3A36%3A20Z&ske=2026-08-09T14%3A36%3A20Z&sks=b&skv=2026-02-06&sig=nPWLSRWmfvSvFv5me9VHfFjXM0muPC%2BdN7QWOrCNxok%3D' -o assets/summer-2026/hawaii-volcano/03.jpg
