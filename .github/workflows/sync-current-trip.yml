name: Sync current trip

on:
  push:
    paths:
      - '_data/current_trip.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Force GitHub Pages to main root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p .pages-diagnostic
          gh api repos/${{ github.repository }}/pages > .pages-diagnostic/before.json || true
          gh api --method PUT repos/${{ github.repository }}/pages \
            -f build_type=legacy \
            -f 'source[branch]=main' \
            -f 'source[path]=/'
          gh api repos/${{ github.repository }}/pages > .pages-diagnostic/after.json
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .pages-diagnostic/last-run.txt
      - name: Commit Pages diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pages-diagnostic
          git diff --cached --quiet && exit 0
          git commit -m "Record Pages source after repair"
          git push
