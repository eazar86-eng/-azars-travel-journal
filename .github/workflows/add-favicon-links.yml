name: Add favicon links

on:
  push:
    paths:
      - '.github/workflows/add-favicon-links.yml'

permissions:
  contents: write

jobs:
  patch-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add explicit favicon links
        run: |
          python - <<'PY'
          from pathlib import Path

          favicon = '<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=20260813at2"><link rel="shortcut icon" href="/favicon.ico?v=20260813at2"><link rel="apple-touch-icon" href="/favicon.png?v=20260813at2">'
          changed = []
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts:
                  continue
              s = p.read_text(encoding='utf-8')
              if 'rel="icon"' in s or "rel='icon'" in s:
                  continue
              marker = '<meta name="viewport" content="width=device-width,initial-scale=1">'
              if marker in s:
                  s = s.replace(marker, marker + favicon, 1)
              elif '</head>' in s:
                  s = s.replace('</head>', favicon + '</head>', 1)
              else:
                  continue
              p.write_text(s, encoding='utf-8')
              changed.append(str(p))
          print('Updated', len(changed), 'HTML files')
          for name in changed:
              print(name)
          PY
      - name: Commit favicon links
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html'
          git commit -m "Add explicit favicon links across site"
          git push
