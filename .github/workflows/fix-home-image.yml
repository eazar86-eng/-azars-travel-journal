name: Fix homepage Disney image

on:
  push:
    paths:
      - '.github/workflows/fix-home-image.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact previous homepage image
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('/assets/summer-2026/day-1608/IMG_0394.jpeg?v=20260817home3', '/assets/summer-2026/day-1608/IMG_0376.jpeg?v=20260817home4')
          s = s.replace('alt="Pixar Pal A Round בדיסנילנד קליפורניה"', 'alt="Disneyland California"')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Restore exact previous homepage Disney image'
          git push
