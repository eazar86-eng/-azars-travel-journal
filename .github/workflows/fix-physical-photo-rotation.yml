name: Fix physical photo rotation
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-physical-photo-rotation.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Rotate files that arrived with stripped iPhone EXIF
        run: |
          set -e
          files=(
            assets/summer-2026/nyc-road/01.jpg
            assets/summer-2026/nyc-road/03.jpg
            assets/summer-2026/nyc-road/04.jpg
            assets/summer-2026/nyc-road/05.jpg
            assets/summer-2026/rockies/01.jpg
            assets/summer-2026/rockies/03.jpg
            assets/summer-2026/rockies/06.jpg
            assets/summer-2026/rockies/07.jpg
            assets/summer-2026/rockies/08.jpg
            assets/summer-2026/rockies/09.jpg
            assets/summer-2026/rockies/12.jpg
            assets/summer-2026/rockies/13.jpg
          )
          for f in "${files[@]}"; do
            echo "Rotating $f 90 degrees clockwise"
            mogrify -rotate 90 -strip -quality 95 "$f"
          done
          echo 'Final dimensions:'
          for f in "${files[@]}"; do identify -format '%f %wx%h\n' "$f"; done
      - name: Commit corrected photos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/summer-2026/nyc-road assets/summer-2026/rockies
          git commit -m 'Physically correct portrait photo rotation'
          git push
