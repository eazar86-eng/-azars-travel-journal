name: Add vehicle showcase

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-vehicle-showcase.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add vehicle showcase to both trip pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          summer = root / 'trips' / 'summer-2026' / 'index.html'
          hawaii = root / 'trips' / 'hawaii-2026' / 'index.html'

          imgs = {
            'suburban': 'https://upload.wikimedia.org/wikipedia/commons/7/77/Suburban.jpg',
            'tahoe': 'https://upload.wikimedia.org/wikipedia/commons/7/7d/%2721_Chevrolet_Tahoe.jpg',
            'traverse': 'https://upload.wikimedia.org/wikipedia/commons/a/a4/24_Chevrolet_Traverse_Z71.jpg',
            'pathfinder': 'https://upload.wikimedia.org/wikipedia/commons/1/1a/%2722_Nissan_Pathfinder.jpg',
          }

          css = '''
          /* Vehicle showcase · Summer 2026 */
          .tripPulse{margin:18px 0 20px;border:1px solid var(--line);border-radius:22px;background:var(--paper);padding:18px 22px;text-align:center;font-size:clamp(15px,2vw,20px);font-weight:950;letter-spacing:.01em}
          .vehicleSection{margin:0 0 22px;background:linear-gradient(180deg,#fffdf8,#f8f1e7);border:1px solid var(--line);border-radius:28px;padding:clamp(22px,4vw,34px);overflow:hidden}
          .vehicleHead{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:20px}
          .vehicleHead .overline{font-size:10px;font-weight:950;letter-spacing:.16em;color:var(--gold);direction:ltr}
          .vehicleHead h2{font-size:clamp(30px,4vw,44px);margin:6px 0 0}
          .vehicleHead p{margin:0;max-width:460px;color:var(--muted);font-size:13px;line-height:1.7}
          .vehicleGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
          .vehicleCard{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 12px 30px rgba(58,45,28,.06)}
          .vehicleMedia{height:230px;background:#ece7df;overflow:hidden}
          .vehicleMedia img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .5s ease}
          .vehicleCard:hover .vehicleMedia img{transform:scale(1.035)}
          .vehicleBody{padding:18px 19px 20px}
          .vehicleNo{font-size:10px;font-weight:950;letter-spacing:.12em;color:var(--gold);direction:ltr}
          .vehicleBody h3{margin:6px 0 6px;font-size:23px;line-height:1.1}
          .vehiclePlace{font-size:12px;font-weight:900;color:var(--accent);margin-bottom:10px}
          .vehicleBody p{font-size:13px;line-height:1.72;color:#555048;margin:0}
          .vehicleCredit{font-size:9px;color:#958d82;margin-top:10px;direction:ltr;text-align:left}
          .hawaiiVehicleSection{width:min(1120px,calc(100% - 30px));margin:0 auto 28px}
          .hawaiiVehicleSection .vehicleSection{margin:0}
          @media(max-width:760px){.vehicleHead{display:block}.vehicleHead p{margin-top:10px}.vehicleGrid{grid-template-columns:1fr}.vehicleMedia{height:210px}.tripPulse{font-size:15px;padding:15px}}
          '''

          credit = 'Wikimedia Commons · CC0 / Public Domain'
          summer_cards = f'''<!-- VEHICLE_SHOWCASE_START -->
          <div class="tripPulse reveal">6 טיסות · 4 רכבים · אלפי קילומטרים · מסע אחד</div>
          <section class="vehicleSection reveal" aria-label="הרכבים שלנו">
            <div class="vehicleHead"><div><div class="overline">THE CARS THAT CARRIED US THROUGH SUMMER 2026</div><h2>על ארבעה גלגלים</h2></div><p>בין הטיסות היו הכבישים. ארבעה רכבים ליוו אותנו בארבעה פרקים שונים של המסע.</p></div>
            <div class="vehicleGrid">
              <article class="vehicleCard"><div class="vehicleMedia"><img src="{imgs['suburban']}" alt="Chevrolet Suburban" loading="lazy" referrerpolicy="no-referrer"></div><div class="vehicleBody"><div class="vehicleNo">01 · ROAD TRIP</div><h3>Chevrolet Suburban</h3><div class="vehiclePlace">Seattle + Canadian Rockies</div><p>הרכב הגדול שליווה אותנו בפרק הארוך של סיאטל, קנדה והרוקיז, עם מקום למשפחה, למזוודות ולכל מה שצריך לדרך.</p><div class="vehicleCredit">{credit}</div></div></article>
              <article class="vehicleCard"><div class="vehicleMedia"><img src="{imgs['pathfinder']}" alt="Nissan Pathfinder" loading="lazy" referrerpolicy="no-referrer"></div><div class="vehicleBody"><div class="vehicleNo">02 · BIG ISLAND</div><h3>Nissan Pathfinder</h3><div class="vehiclePlace">Big Island · Dollar</div><p>הרכב שלנו בביג איילנד, מהנסיעות סביב קונה ועד הדרך לפארק הרי הגעש ולצפון האי.</p><div class="vehicleCredit">{credit}</div></div></article>
              <article class="vehicleCard"><div class="vehicleMedia"><img src="{imgs['tahoe']}" alt="Chevrolet Tahoe" loading="lazy" referrerpolicy="no-referrer"></div><div class="vehicleBody"><div class="vehicleNo">03 · MAUI</div><h3>Chevrolet Tahoe</h3><div class="vehiclePlace">Maui · Avis</div><p>הרכב שליווה אותנו במאווי והיה הבית שלנו על הכביש גם ביום הארוך של Road to Hana.</p><div class="vehicleCredit">{credit}</div></div></article>
              <article class="vehicleCard"><div class="vehicleMedia"><img src="{imgs['traverse']}" alt="Chevrolet Traverse" loading="lazy" referrerpolicy="no-referrer"></div><div class="vehicleBody"><div class="vehicleNo">04 · FINAL CHAPTER</div><h3>Chevrolet Traverse</h3><div class="vehiclePlace">Los Angeles</div><p>הרכב של הפרק האחרון במסע, לוס אנג׳לס והנסיעות סביב העיר בימים האחרונים לפני החזרה הביתה.</p><div class="vehicleCredit">{credit}</div></div></article>
            </div>
          </section>
          <!-- VEHICLE_SHOWCASE_END -->'''

          hawaii_cards = f'''<!-- HAWAII_VEHICLE_SHOWCASE_START -->
          <section class="hawaiiVehicleSection"><div class="vehicleSection">
            <div class="vehicleHead"><div><div class="overline">TWO ISLANDS · TWO CARS</div><h2>על ארבעה גלגלים בהוואי</h2></div><p>שני איים, שני רכבים שונים, והרבה מאוד כביש בין חוף, הר געש, מפלים ויער טרופי.</p></div>
            <div class="vehicleGrid">
              <article class="vehicleCard"><div class="vehicleMedia"><img src="{imgs['pathfinder']}" alt="Nissan Pathfinder" loading="lazy" referrerpolicy="no-referrer"></div><div class="vehicleBody"><div class="vehicleNo">BIG ISLAND</div><h3>Nissan Pathfinder</h3><div class="vehiclePlace">Dollar</div><p>הרכב של ביג איילנד, מרווח ונוח לנסיעות הארוכות בין קונה, הצפון והרי הגעש.</p><div class="vehicleCredit">{credit}</div></div></article>
              <article class="vehicleCard"><div class="vehicleMedia"><img src="{imgs['tahoe']}" alt="Chevrolet Tahoe" loading="lazy" referrerpolicy="no-referrer"></div><div class="vehicleBody"><div class="vehicleNo">MAUI</div><h3>Chevrolet Tahoe</h3><div class="vehiclePlace">Avis</div><p>הרכב של מאווי, כולל היום הארוך והמפותל של Road to Hana.</p><div class="vehicleCredit">{credit}</div></div></article>
            </div>
          </div></section>
          <!-- HAWAII_VEHICLE_SHOWCASE_END -->'''

          def add_css(s):
            if '/* Vehicle showcase · Summer 2026 */' not in s:
              s = s.replace('</style>', css + '</style>', 1)
            return s

          s = summer.read_text(encoding='utf-8')
          s = add_css(s)
          s = re.sub(r'<!-- VEHICLE_SHOWCASE_START -->.*?<!-- VEHICLE_SHOWCASE_END -->', '', s, flags=re.S)
          if '<nav class="tools">' not in s:
            raise RuntimeError('Summer insertion marker missing')
          s = s.replace('<nav class="tools">', summer_cards + '\n<nav class="tools">', 1)
          summer.write_text(s, encoding='utf-8')

          s = hawaii.read_text(encoding='utf-8')
          s = add_css(s)
          s = re.sub(r'<!-- HAWAII_VEHICLE_SHOWCASE_START -->.*?<!-- HAWAII_VEHICLE_SHOWCASE_END -->', '', s, flags=re.S)
          # Remove duplicated old text-only vehicle practical cards.
          s = re.sub(r'<article class="practicalCard">\s*<div class="icon">.*?</div>\s*<strong>הרכב בביג איילנד</strong>.*?</article>', '', s, count=1, flags=re.S)
          s = re.sub(r'<article class="practicalCard">\s*<div class="icon">.*?</div>\s*<strong>הרכב במאווי</strong>.*?</article>', '', s, count=1, flags=re.S)
          if '<nav class="days"' not in s:
            raise RuntimeError('Hawaii insertion marker missing')
          s = s.replace('<nav class="days"', hawaii_cards + '\n<nav class="days"', 1)
          hawaii.write_text(s, encoding='utf-8')
          PY
      - name: Commit vehicle showcase
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trips/summer-2026/index.html trips/hawaii-2026/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add magazine vehicle showcase to trip pages'
          git push
