name: Add header logo
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/brand-logo.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update main headers
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [Path('index.html'), Path('trips/summer-2026/index.html'), Path('trips/hawaii-2026/index.html')]
          old = '<a class="brand" href="/">Azar’s Travel</a>'
          new = '<a class="brand" href="/"><img class="brandLogo" src="/favicon.png" alt=""><span>Azar’s Travel</span></a>'
          css = '.brand{display:inline-flex!important;align-items:center;gap:9px;direction:ltr}.brandLogo{width:34px;height:34px;border-radius:9px;object-fit:cover;display:block;flex:0 0 34px}@media(max-width:800px){.brandLogo{width:30px;height:30px;flex-basis:30px;border-radius:8px}}'
          for p in files:
              s = p.read_text(encoding='utf-8')
              if old in s:
                  s = s.replace(old, new, 1)
              if '.brandLogo{' not in s:
                  s = s.replace('</style>', css + '</style>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html trips/summer-2026/index.html trips/hawaii-2026/index.html
          git commit -m "Show AT logo in main site headers" || exit 0
          git push
