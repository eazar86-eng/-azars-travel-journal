name: Fix legacy New York trip link

on:
  push:
    paths:
      - '.github/workflows/fix-legacy-new-york-link.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Summer 2026 legacy New York links
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('trips/summer-2026/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('href="#new-york"', 'href="/trips/summer-2026/new-york/"')
          marker = '<script id="legacy-destination-redirect">'
          if marker not in s:
              redirect = '''<script id="legacy-destination-redirect">(function(){const m={\'#new-york\':\'/trips/summer-2026/new-york/\',\'#seattle\':\'/trips/summer-2026/seattle/\',\'#rockies\':\'/trips/summer-2026/rockies/\',\'#glacier\':\'/trips/summer-2026/glacier/\'};const to=m[location.hash];if(to)location.replace(to);})();</script>'''
              s = s.replace('</head>', redirect + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trips/summer-2026/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Route legacy destination anchors to dedicated pages'
          git push
